name: debug
on: workflow_dispatch
jobs:
  d:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Invoke-WebRequest https://dubbingmate.com/download/updates/DubbingMate-Setup-0.1.32-x64.exe -OutFile $env:TEMP\s.exe
          $d = "$env:LOCALAPPDATA\Programs\DubbingMate"
          function chk($n){ Write-Host "[$n] dir=$(Test-Path $d) exe=$(Test-Path $d\DubbingMate.exe)" }
          # A: redirected output, no window (choco style)
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "$env:TEMP\s.exe"; $psi.Arguments='/S'; $psi.UseShellExecute=$false
          $psi.RedirectStandardOutput=$true; $psi.RedirectStandardError=$true; $psi.CreateNoWindow=$true
          $p=[Diagnostics.Process]::Start($psi); $p.WaitForExit(); Write-Host "A redirected exit=$($p.ExitCode)"; chk A
          Get-Process DubbingMate -ErrorAction SilentlyContinue | Stop-Process -Force
          # B: via choco with the package files
          choco pack | Out-Null
          choco install dubbingmate -s . -y --no-progress 2>&1 | Select-String "Exit code|installed|Hashes" 
          chk B
          Get-ChildItem C:\ProgramData\chocolatey\logs\chocolatey.log | Out-Null
          Select-String -Path C:\ProgramData\chocolatey\logs\chocolatey.log -Pattern "DubbingMate|1073741819|Process" | Select -Last 12 | % { Write-Host $_.Line.Substring(0,[Math]::Min(250,$_.Line.Length)) }
